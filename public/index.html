<!DOCTYPE html>
<html>

<head>
  <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="shortcut icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Flappy Ferris" />
  <link rel="manifest" href="./site.webmanifest" />
  <title>Flappy Ferris - Bevy Web App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script defer src="https://unpkg.com/vue@3/dist/vue.global.js"
    integrity="sha384-o0XhjjchKAjA3RDDJZatNHsCZEyZGduAW1aoWEOks1/88a83+CPVAdJfYVcM6G/A"
    crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0px;
      /* blue sky color */
      background: #80b2cc !important;
    }

    main {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-menu ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    #game-menu ul li {
      padding: 5px;
      margin: 0px;
      line-height: 75%;
    }

    #menu-card a {
      text-decoration: none;
      font-weight: 500;
      color: green;
    }

    #play-button {
      width: 100%;
      font-weight: bold;
    }

    #loader {
      font-size: xx-large;
      font-weight: bold;
    }
  </style>
  <style>
    [v-cloak] {
      display: none;
    }
  </style>
</head>

<body>
  <span id="app">
    <main ref="main">
      <section v-if="showMenu" class="card shadow" id="game-menu" style="width: 18rem;">
        <div class="card-body" id="menu-card">
          <h1 class="card-title text-center"> Flappy Ferris</h1>
          <hr>
          <!-- <img src="..." class="card-img-top" alt="..."> -->
          <div class="my-4 text-center">
            This game is a variant of
            <a href="https://www.youtube.com/watch?v=_C28kqin94c">Flappy Bird</a>
            written in
            <a href="https://rust-lang.org/">Rust</a>
            using <a href="https://bevy.org/">Bevy</a> compiled to
            <a href="https://webassembly.org/">WASM</a>.
          </div>
          <hr>
          <div class="my-4">
            <ul>
              Made by:
              <li>
                <a href="https://homeroroman.com/">Homero Roman</a>
              </li>
              <li>
                <a href="https://frederickroman.com/">Frederick Roman</a>
              </li>
            </ul>
          </div>
          <hr>
          <div class="text-center">
            <button type="button" @click="play" class="btn btn-warning" id="play-button"> PLAY </button>
          </div>
        </div>
      </section>
      <div v-else-if="isLoading" v-cloak id="loader">
        <figure>
          <img src="./assets/bevy_logo.svg" alt="Trulli" style="width:320px">
          <figcaption> Loading... </figcaption>
        </figure>
      </div>
    </main>
  </span>

  <script type="module">
    import init from './flappy_bird.js'; // Import the generated JS wrapper module
    import emitSpacebarPress from './emit_space_press.js';
    import fitElementToScreen from './fit_element_to_screen.js'

    const app = Vue.createApp({
      data() {
        return {
          showMenu: true /** @type {boolean} */,
          isLoading: false /** @type {boolean} */,
        };
      },
      methods: {
        /**
          * Initializes WASM module and sets up game canvas to full screen.
          * @returns {Promise<void>}
          */
        async run() {
          try {
            this.isLoading = true;
            await init(); // Wait for the WASM module to be initialized
            const canvas = document.querySelector("[alt='Flappy Bird']");
            // Respond to touch/click events
            canvas.addEventListener("click", () => emitSpacebarPress(canvas))
            canvas.addEventListener("touchstart", () => emitSpacebarPress(canvas))
            // Resize canvas to fit screen
            canvas.style.display = "block";
            setTimeout(() => fitElementToScreen(canvas), 0)
            window.addEventListener('resize', () => setTimeout(() => fitElementToScreen(canvas), 0));
          } catch (error) {
            console.error(error)
          } finally {
            this.$refs.main.style.display = "none";
            this.isLoading = false;
          }
        },
        /**
          * Closes the game menu and runs the game.
          * @returns {Promise<void>}
          */
        async play() {
          try {
            this.showMenu = false;
            await this.run();
          } catch (error) {
            console.error(error)
          }
        }
      }
    });

    app.mount('#app');
  </script>
</body>

</html>
